<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অর্ডার - Logistic Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-cube"></i> Logistic Management
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">হোম</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">প্রোডাক্ট</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="orders.html">অর্ডার</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="logout()">লগআউট</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col-md-6">
                <h2>অর্ডার ম্যানেজমেন্ট</h2>
            </div>
            <div class="col-md-6 text-end">
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#orderModal">
                    <i class="fas fa-plus"></i> নতুন অর্ডার
                </button>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>অর্ডার নম্বর</th>
                        <th>গ্রাহক</th>
                        <th>মোট পরিমাণ</th>
                        <th>স্ট্যাটাস</th>
                        <th>তারিখ</th>
                        <th>অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="ordersList"></tbody>
            </table>
        </div>
    </div>

    <!-- Add Order Modal -->
    <div class="modal fade" id="orderModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">নতুন অর্ডার তৈরি করুন</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="orderForm">
                        <div class="mb-3">
                            <label class="form-label">ডেলিভারি ঠিকানা</label>
                            <input type="text" class="form-control" id="addressStreet" placeholder="রাস্তা" required>
                            <input type="text" class="form-control mt-2" id="addressCity" placeholder="শহর" required>
                            <input type="text" class="form-control mt-2" id="addressZip" placeholder="পোস্টাল কোড" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">পণ্য নির্বাচন করুন</label>
                            <div id="productOptions">
                                <p class="text-muted">পণ্য লোড হচ্ছে...</p>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">অর্ডার তৈরি করুন</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Update Modal -->
    <div class="modal fade" id="statusModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">স্ট্যাটাস আপডেট করুন</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="statusForm">
                        <div class="mb-3">
                            <label class="form-label">নতুন স্ট্যাটাস</label>
                            <select class="form-control" id="newStatus" required>
                                <option value="">-- বেছে নিন --</option>
                                <option value="pending">অপেক্ষা</option>
                                <option value="processing">প্রসেস করা হচ্ছে</option>
                                <option value="shipped">পাঠানো হয়েছে</option>
                                <option value="delivered">ডেলিভার করা হয়েছে</option>
                                <option value="cancelled">বাতিল করা হয়েছে</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">মন্তব্য</label>
                            <textarea class="form-control" id="statusNotes" rows="3"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">আপডেট করুন</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        let currentOrderId = null;

        // Load Orders
        async function loadOrders() {
            if (!isAuthenticated()) {
                window.location.href = 'login.html';
                return;
            }

            const result = await apiCall('/orders/all');
            const ordersList = document.getElementById('ordersList');
            ordersList.innerHTML = '';

            if (result.success) {
                result.data.forEach(order => {
                    const row = `
                        <tr>
                            <td><strong>${order.orderNumber}</strong></td>
                            <td>${order.customer?.fullName || 'N/A'}</td>
                            <td>৳${order.totalAmount}</td>
                            <td><span class="badge bg-info">${order.status}</span></td>
                            <td>${formatDate(order.createdAt)}</td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="openStatusModal('${order._id}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    ordersList.innerHTML += row;
                });
            }
        }

        // Open Status Modal
        function openStatusModal(orderId) {
            currentOrderId = orderId;
            const statusModal = new bootstrap.Modal(document.getElementById('statusModal'));
            statusModal.show();
        }

        // Update Order Status
        document.getElementById('statusForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const status = document.getElementById('newStatus').value;
            const notes = document.getElementById('statusNotes').value;

            const result = await apiCall(`/orders/${currentOrderId}/status`, 'PUT', {
                status,
                notes
            });

            if (result.success) {
                showToast('✅ স্ট্যাটাস আপডেট হয়েছে', 'success');
                loadOrders();
                bootstrap.Modal.getInstance(document.getElementById('statusModal')).hide();
            } else {
                showToast('❌ আপডেট ব্যর্থ', 'danger');
            }
        });

        loadOrders();
    </script>
</body>
</html>
